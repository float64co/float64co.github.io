# Level 3: a serial-number checker. The rule is a loop over the characters, so the player has to read the code.
# Generated by a throwaway assembler so every byte and relative jump is real.

id = "license-check"
title = "license-check"
flag = "FLAG{sum_of_all_parts}"
flag_path = "/opt/license/flag.txt"
vuln = "serial-check"
prompt_text = "serial: "
readme = """== license ======================================================

Brightside ships a small license checker. Give it a valid serial number
and it prints the flag from /opt/license/flag.txt (root only otherwise).

Nobody wrote the rule down. There are many valid serials; you need to work
out what the program actually checks, then produce one.

Goal: make ./license print the flag, and save a working serial to
~/workspace/serial.txt.

Toolbox: r2 (aaa, pdf @ sym.check_serial), gdb (step through the loop and
watch the registers), python3 for the arithmetic.
"""

[binary]
path = "/home/player/license/license"
base = 0x400000
build_id = "1b2c3d4e5f60718293a4b5c6d7e8f90123456789"

[mitigations]
relro = "partial"
canary = false
nx = true
pie = false

[stack]
buffer_addr = 0x7fffffffdfa0
buffer_size = 48
saved_rbp = 0x7fffffffdfe0
return_addr = 0x0
size = 512

[imports]
printf = 0x401030
scanf = 0x401040
puts = 0x401050
system = 0x401060

[[strings]]
addr = 0x402004
text = "serial: "

[[strings]]
addr = 0x40200d
text = "%31s"

[[strings]]
addr = 0x402012
text = "Licensed."

[[strings]]
addr = 0x40201c
text = "Invalid."

[[strings]]
addr = 0x402025
text = "cat /opt/license/flag.txt"

[[functions]]
name = "main"
addr = 0x4011ce
insns = [
  "4011ce 55 push rbp",
  "4011cf 4889e5 mov rbp, rsp",
  "4011d2 4883ec30 sub rsp, 0x30",
  "4011d6 488d3d270e0000 lea rdi, str.serial_ ; 0x402004",
  "4011dd b800000000 mov eax, 0",
  "4011e2 e849feffff call sym.imp.printf",
  "4011e7 488d45d0 lea rax, [rbp-0x30]",
  "4011eb 4889c6 mov rsi, rax",
  "4011ee 488d3d180e0000 lea rdi, str._31s ; 0x40200d",
  "4011f5 b800000000 mov eax, 0",
  "4011fa e841feffff call sym.imp.scanf",
  "4011ff 488d45d0 lea rax, [rbp-0x30]",
  "401203 4889c7 mov rdi, rax",
  "401206 e86bffffff call sym.check_serial",
  "40120b 85c0 test eax, eax",
  "40120d 751a jne 0x401229",
  "40120f 488d3dfc0d0000 lea rdi, str.Licensed. ; 0x402012",
  "401216 e835feffff call sym.imp.puts",
  "40121b 488d3d030e0000 lea rdi, str.cat__opt_license_flag.txt ; 0x402025",
