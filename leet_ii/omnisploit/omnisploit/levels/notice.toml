# Level 5: a format-string vulnerability. The notice board passes player input straight to
# printf() as the format string itself, instead of printf("%s", input), so %x/%p/%N$x read
# whatever is sitting in the argument registers and the caller's stack -- including a local
# variable that was never meant to be printed. Generated; see engine/cpu.py for the engine.

id = "notice"
title = "notice"
flag = "FLAG{format_strings_leak_everything}"
flag_path = "/opt/notice/flag.txt"
vuln = "format-string"
prompt_text = "notice: "
readme = """== notice =======================================================

Brightside's internal noticeboard. Post a notice and it prints it back
to confirm. The flag lives in /opt/notice/flag.txt and only root can
read it -- but notice doesn't need to read that file to show you the
flag; it already has it in memory.

There is nothing to overflow here, and nothing to compare a password
against. Read what the program actually does with what you type.

Goal: make ./notice print the flag.

Toolbox: r2 (aaa, pdf @ main) to see the vulnerable call, gdb (break on
it and look at the registers and the stack above $rsp), man printf for
what %x, %p and the positional %N$x form actually mean.
"""

