[project]
name = "omnisploit"
version = "0.1.0"
description = "ncurses exploit-development game with a fully simulated machine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnisploit = "omnisploit.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
omnisploit = ["levels/*.toml"]
