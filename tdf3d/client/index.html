<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour De Force</title>
  <link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-sans/latin-700-italic.css">
  <style>
    body { background: #000; margin: 0; overflow: hidden; font: 14px monospace; color: #fff; }
    #verdict { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; font: italic 700 min(20vw, 200px) "IBM Plex Sans", sans-serif; letter-spacing: 0.04em; text-shadow: 0 0 2px #000, 0 6px 30px #000c; pointer-events: none; }
    #verdict[hidden] { display: none; }
    #intro { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
    #hud { position: fixed; top: 10px; left: 10px; padding: 8px 12px; background: #0009; white-space: pre; }
    #fps { position: fixed; top: 10px; right: 10px; z-index: 1; padding: 8px 12px; background: #0009; color: #fff; }
    #fps[hidden] { display: none; }
    #ammo { position: fixed; bottom: 44px; right: 56px; font-size: 72px; font-weight: bold; color: #fff; text-shadow: 0 0 4px #000; pointer-events: none; }
    #ammo[hidden] { display: none; }
    #ammo:not([hidden]) ~ #perf { bottom: 146px; }
    #perf { position: fixed; bottom: 10px; right: 10px; z-index: 1; margin: 0; padding: 8px 12px; background: #000c; pointer-events: none; }
    #perf[hidden] { display: none; }
    #wanted { position: fixed; top: 10px; right: 12px; font-size: 24px; letter-spacing: 0.3em; margin-right: -0.3em; text-shadow: 0 0 3px #000; pointer-events: none; }
    #fps:not([hidden]) ~ #wanted { top: 52px; }
    #radio { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: 44vw; text-align: center; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 10px #000a; pointer-events: none; }
    #radio[hidden] { display: none; }
    #radio div { overflow: hidden; text-overflow: ellipsis; }
    #radio-station { font-size: 14px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.85; }
    #radio-track { font-size: 24px; font-weight: bold; }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px; background: #fff; box-shadow: 0 0 0 1px #000; pointer-events: none; }
    #crosshair[hidden] { display: none; }
    #console { position: fixed; inset: 0 0 auto 0; height: 60vh; display: flex; flex-direction: column; background: #000d; }
    #console[hidden] { display: none; }
    #console pre { flex: 1; min-height: 3em; margin: 0; padding: 8px 12px; overflow-y: auto; }
    #console ul { margin: 0; padding: 4px 0; max-height: 65%; overflow-y: auto; list-style: none; border-top: 1px solid #555; }
    #console ul[hidden] { display: none; }
    #console li { display: grid; grid-template-columns: 17ch 12ch 1fr; gap: 1ch; padding: 1px 12px; cursor: pointer; }
    #console li.selected { background: #2962ff; }
    #console li span:last-child { color: #bbb; }
    #console input { padding: 8px 12px; font: inherit; color: inherit; background: #222; border: 0; outline: 0; }
  </style>
</head>
<body>
  <div id="hud">Loading…</div>
  <div id="fps" hidden></div>
  <div id="wanted"></div>
  <div id="radio" hidden><div id="radio-station"></div><div id="radio-track"></div></div>
  <div id="verdict" hidden></div>
  <div id="ammo" hidden></div>
  <pre id="perf" hidden></pre>
  <div id="crosshair" hidden></div>
  <div id="console" hidden><pre></pre><ul hidden></ul><input aria-label="console command" autocomplete="off" spellcheck="false"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
