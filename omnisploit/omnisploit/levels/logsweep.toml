# Level 8: a privilege-escalation level. The binary itself is the exact same overflow as
# motd-daemon (same bytes, same addresses -- only the strings and the setuid bit differ), but it
# lives on a compromised network host, owned by root with the setuid bit set, so exploiting it as
# an unprivileged user gets root's own file instead of a flag file anyone could read directly.
# requires_suid tells the engine's system() stub to refuse unless the VFS node is actually setuid.

id = "logsweep"
title = "logsweep"
flag = "FLAG{root_left_a_setuid_present}"
flag_path = "/root/root.txt"
vuln = "stack_overflow_suid"
prompt_text = "wipe? "
requires_suid = true
remote_only = true
readme = """== logsweep =====================================================

A setuid-root helper on this box: ops wrote it so ordinary users could
clean up their own log files without a full sudo grant. It is owned by
root with the setuid bit set -- check `ls -l` or `find / -perm -4000`.

Whoever wrote it never expected the file name you give it to be this
long. The flag is root's own /root/root.txt, unreadable to you
directly, but logsweep's own win() path reads it for you.

Goal: make ./logsweep print the flag. The technique is exactly the
overflow from motd-daemon; what's new is where the binary lives, who
owns it, and why that matters.
"""

[binary]
path = "/usr/local/bin/logsweep"
base = 0x400000
build_id = "a1b2c3d4e5f60718293a4b5c6d7e8f900112233"

[mitigations]
relro = "partial"
canary = false
nx = true
pie = false

[stack]
buffer_addr = 0x7fffffffdf90
buffer_size = 64
saved_rbp = 0x7fffffffdfe0
return_addr = 0x4011fc
size = 512

[imports]
printf = 0x401030
gets = 0x401040
system = 0x401050

[[strings]]
addr = 0x402004
text = "wipe? "

[[strings]]
addr = 0x40200b
text = "Swept: %s\n"

[[strings]]
addr = 0x402016
text = "cat /root/root.txt"

[[functions]]
name = "win"
addr = 0x401196
insns = [
  "401196 55 push rbp",
  "401197 4889e5 mov rbp, rsp",
  "40119a 488d3d750e0000 lea rdi, str.cat__root_root.txt ; 0x402016",
  "4011a1 e8aafeffff call sym.imp.system",
  "4011a6 90 nop",
  "4011a7 5d pop rbp",
  "4011a8 c3 ret",
]

[[functions]]
name = "vuln"
addr = 0x4011a9
locals = ["var char *s @ rbp-0x40"]
insns = [
  "4011a9 55 push rbp",
  "4011aa 4889e5 mov rbp, rsp",
  "4011ad 4883ec40 sub rsp, 0x40",
  "4011b1 488d3d4c0e0000 lea rdi, str.wipe_ ; 0x402004",
  "4011b8 b800000000 mov eax, 0",
  "4011bd e86efeffff call sym.imp.printf",
  "4011c2 488d45c0 lea rax, [s]",
  "4011c6 4889c7 mov rdi, rax",
  "4011c9 b800000000 mov eax, 0",
  "4011ce e86dfeffff call sym.imp.gets",
  "4011d3 488d45c0 lea rax, [s]",
  "4011d7 4889c6 mov rsi, rax",
  "4011da 488d3d2a0e0000 lea rdi, str.Swept___s ; 0x40200b",
  "4011e1 b800000000 mov eax, 0",
  "4011e6 e845feffff call sym.imp.printf",
  "4011eb 90 nop",
  "4011ec c9 leave",
  "4011ed c3 ret",
]

[[functions]]
name = "main"
addr = 0x4011ee
insns = [
  "4011ee 55 push rbp",
  "4011ef 4889e5 mov rbp, rsp",
  "4011f2 b800000000 mov eax, 0",
  "4011f7 e8adffffff call sym.vuln",
  "4011fc b800000000 mov eax, 0",
  "401201 5d pop rbp",
  "401202 c3 ret",
]
