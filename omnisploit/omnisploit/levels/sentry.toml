# Level 6: the same ret2win as motd, but with a stack canary this time. Overflowing straight
# through to the return address trips "stack smashing detected" instead; the payload has to
# preserve the canary's exact bytes to get past it. In this simulation the canary is a fixed
# constant baked into the instructions (there is no ASLR/TLS here), so it can be read straight
# out of the disassembly or the stack -- the point of this level is what you do once you have it,
# not practicing a leak (that is the notice level). Generated; see engine/cpu.py for the engine.

id = "sentry"
title = "sentry"
flag = "FLAG{the_canary_sings_if_you_listen}"
flag_path = "/opt/sentry/flag.txt"
vuln = "stack_overflow_canary"
prompt_text = "guard: "
readme = """== sentry =======================================================

Brightside's "sentry" service is the same kind of overflow as motd --
except this one was compiled with a stack canary. The flag lives in
/opt/sentry/flag.txt and only root can read it, but sentry's win()
function will cat it for you.

A plain ret2win payload (junk + win's address) will not work here:
it corrupts the canary on the way to the return address, and the
program aborts with "stack smashing detected" before it ever returns.

You need the canary's exact value, then build a payload that writes
it back unchanged before overwriting the return address.

Goal: make ./sentry print the flag.

Toolbox: checksec (now actually reports a canary), r2 (pdf @ sym.vuln
shows the comparison and its constant directly), gdb (break before the
comparison and x/gx the stack), python3 with pwn for the payload.
"""

[binary]
path = "/home/player/sentry/sentry"
base = 0x400000
build_id = "1c2b3a4958677869504132f1e0d0c0b0a090807"

[mitigations]
relro = "partial"
canary = true
nx = true
pie = false

[stack]
buffer_addr = 0x7fffffffdf90
buffer_size = 72
saved_rbp = 0x7fffffffdfe0
return_addr = 0x0
size = 512

[imports]
printf = 0x401030
