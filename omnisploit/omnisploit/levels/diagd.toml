# Level 4: a menu program with an undocumented option. Nothing about it shows up in `strings`.
# Generated by a throwaway assembler so every byte and relative jump is real.

id = "diagd"
title = "diagd"
flag = "FLAG{not_every_door_has_a_sign}"
flag_path = "/opt/diagd/flag.txt"
vuln = "hidden-function"
prompt_text = "choice: "
readme = """== diagd ========================================================

diagd is Brightside's diagnostics tool. Its menu offers a status report
and a version string, and that is all the documentation says.

Operators swear there is a third entry that dumps /opt/diagd/flag.txt
(root only otherwise), left in by a developer. The menu does not list it.

Goal: find what the program really responds to, and make ./diagd print
the flag. Save the function that does it to ~/workspace/hidden.txt and
the menu number that reaches it to ~/workspace/choice.txt.

Toolbox: strings (it will not help), r2 (afl, axt, pdf @ main),
gdb (stop at the comparisons and look at what is being compared).
"""

[binary]
path = "/home/player/diagd/diagd"
base = 0x400000
build_id = "c0ffee1234567890abcdef1234567890abcdef12"

[mitigations]
relro = "partial"
canary = false
nx = true
pie = false

